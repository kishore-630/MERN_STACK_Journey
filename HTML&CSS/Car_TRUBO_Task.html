<!DOCTYPE html>
<html>
    <head>
        <title>
            Car TURBO
        </title>
        <style>
    *{
        margin:0;
        padding:0;
    }
    body{
        font-family: Arial, Helvetica, sans-serif;
        min-height:100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #111827;
        
    }
    .dashboard{
        width:350px;
        padding: 30px;
        background-color: #cfd3ca;
        border-radius: 20px;
        text-align: center;
        color: white;
        box-shadow: 0 10px 30px rgb(231, 145, 145);
        animation: 
    cardEntrance 2s ease 6.5s backwards;
    
    }
    .dashboard:hover{
        background-color: #80a3df;
    }
    h2{
        color:#8426dc;
        margin-bottom: 20px;
        font-size:30px;
    }
    .car{
        font-size: 70px;
        margin-bottom: 15px;
        animation: carMove 2s ease-in-out infinite;
    }
    hr{
        color: black;
        margin-top:-20px;
        margin-bottom:20px;
    }
    .speed{
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    .speed span{
        font-size: 20px;
        color:#0241ae;
    }
    .progress-card{
        width:100%;
        height:15px;
        background-color: #566071;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
    }
    .progress-bar{
        width:40%;
        height:100%;
        background-color: #22cf53;
        animation: speedProgress 2s ease-in-out infinite alternate;
    }
    .turbo-btn{
        padding:12px 27px;
        border: none;
        border-radius: 10px;
        background-color: #ef4444;
        color: black;
        font-size: 17px;
        font-weight: bold;
        box-shadow: 0px 10px 15px;
        cursor:pointer;
        transition: transform 0.5s ease,
                    background 0.3 ease ;
    }
    .turbo-btn:hover{
        transform:scale(1.18)translateY(-2px);
        background-color: #dc2626;
    }
    @keyframes cardEntrance {
    0%{
        transform: translateY(76px);
    }
    100%{
        transform: translateY(-19px);
        opacity:1;
    }
    
}
    @keyframes speedProgress{
        30%{
            transform: scale(1.0);
        }
        40%{
            transform: scale(1.5);
        }
         70%{
            transform: scale(3.0);
        }
        90%{
            transform: scale(2.5);
        }
        100%{
            transform:scale(1.0) ;
        }

    }
    @keyframes carMove{
        0%{
            transform:translateX(-20px);
        }
        50%{
            transform: translateX(20px);
        }
        100%{
            transform:translateX(-60px);
        }
    }
        </style>
    </head>
    <body>
        <div class="dashboard">
            <h2> Car Dashboard</h2>
            <div class="car">
                🚗
            </div>
            <hr>
            <div class="speed">
                110<span>Km/h</span>

            </div>
            <div class="progress-card">
                <div class="progress-bar">
                </div>
                </div>
                <button class="turbo-btn">
                    TURBO
                </button>
        </div>
    </body>
</html>
