<!DOCTYPE html>
<html>
    <head>
        <title>
            CSS Animations
        </title>
        <style>
body{
    margin: 0;
    min-height:100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #918e8e;
    color: white;
    padding: 0;

}
.card{
    width:300px;
    padding:30px;
    text-align: center;
    border: 2px solid  #00ff88;
    border-radius: 15px;
    box-shadow: 0px -1px 15px 5px black;
    animation: 
    cardEntrance 2s ease 6.5s backwards,
    cardBackground 8s linear infinite;
}
.status{
         width:25px;
        height:25px;
        margin: 20px auto;
        border-radius:50%;
        background-color: #00ff;
        animation: pulse  1.5s ease-in-out infinite;
}.bar{
    width:100%;
    height:10px;
    margin-top: 25px;
    border-radius: 16px;
    background-color: black;
    overflow: hidden;
}
.progress{
    width:30px;
    height:100%;
    background-color: #fe2;
    animation: loading 2s linear infinite alternate;
}
@keyframes cardEntrance {
    0%{
        transform: translateY(56px);
    }
    100%{
        transform: translateY(0);
        opacity:1;
    }
    
}
    
@keyframes pulse {
    0%{
        transform:scale(1);
    }
    50%{
        transform: scale(1.4);
    }
    100%{
        transform: scale(1);
    }
    
}
  @keyframes loading{
    0%{
        width:34%;
    
    }
    100%{
      width:100%;
    }
  }
  @keyframes cardBackground {
    0%{
        background-color: #24dfff;
    }
    15%{
        background-color: #f72d;
    }
    30%{
        background-color: #235f13;
    }
    50%{
        background-color: #432324;
    }
    75%{
        background-color: #6323d2;
    }
    90%{
        background-color: black;
    }
    100%{
        background-color:#538ff1;
    }
    
  }
        </style>
    </head>
    <body>
       <div class="card">
        <h1>😎Royal Entry</h1>
        <p>All are Waiting For New Event</p>
        <div class="status"></div>
        <p>coming Soon........</p>
        <div class="bar">
            <div class="progress"></div>
        </div>
       </div> 
    </body>
</html>
