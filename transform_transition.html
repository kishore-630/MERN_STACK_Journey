<!DOCTYPE html>
<html>
    <head>
        <title>
            Tranform and Transition
        </title>
        <style>
body{
margin: 0;
min-height:100vh;
display:flex;
justify-content: center;
align-items: center;
font-family: Arial, Helvetica, sans-serif;
background-color: #d8c2c2;
color:rgb(240, 114, 251);
}
.card{
width: 300px;
padding: 30px;
text-align: center;
background-color:#6132ce;
border: 2px solid  rgb(0, 0, 0);
border-radius:12px;
box-shadow: 0px -1px 15px 2px black;
transition: transform 0.4s ease,
            background-color 0.4s ease;
}
.card:hover{
    transform:translateY(-10px) scale(1.05);
    background-color: #863b82;
}

.icon{
    width: 80px;
    height: 80px;
    margin:auto;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background-color: #8b5cf6;
    font-size: 35px;
    transition: tranform 0.5s ease;
}
.card:hover .icon{
    transform: rotate(360deg);
}
.button{
    display: inline-block;
    margin-top:20px;
    padding:12px  25px;
    border-radius:25px;
    background-color: #3697a8;
    color:white;
    transition: transform 0.3s ease,
                background-color 0.3s ease;
}
.button:hover{
    transform: translateY(-10px);
    background-color: #d66d2c;
}
        </style>
    </head>
    <body>
        <div class="card">
            <div class="icon">
                🎯
            </div>
       <h1> ShadowX</h1>
       <p> Level 42 Associate</p>
       <div class="button">
        Play Now</div>
        </div>
    </body>
</html>
