<!DOCTYPE html>
<html>
    <head>
  <title> Basic From</title>
  <style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        padding:0%;
        margin: 0%;
        background-color: antiquewhite;
    }
    .card{
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top:30px;
    }
    .registration{
        display: flex;
        justify-content: center;
        border: 2px solid black ;
        border-radius: 10px 12px;
        padding:15px;
        height:50vh;
        width:300px;
        margin-top:10px;
        box-shadow:-0px -0px 10px 2px rgb(54, 3, 25);
        
    }
    .details{
        margin:10px;
        background-color:rgb(174, 126, 147);
        padding:20px;
        border: 16px;
        border-radius:18px; 
 
    }
    h2{
        text-align: center;
        font-weight: 29px;
    }
    button{
        font-size: large;
        background-color: rgb(134, 134, 239);
        border-radius: 8px;
        display: flex;
        justify-content: end;
    }
  </style>
</head>
  <body>
    <div class="card">
    <div class="registration">
<form class="details">   
 <h2> 👤Analyse the Each details </h2>
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter your Name">
    <br><br>
    <label for="options"></label>
    <label for="email">Email:</label>
    <input id="email" placeholder="email" type="email">
    <br><br>

     <label for="password">Password:</label>
    <input id="password" placeholder="password" type="password">
    <br><br>
    <button for="submit" >Submit</button>
</form>
</div>
</div>
</body>
</html>
