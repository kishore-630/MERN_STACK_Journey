<!DOCTYPE html>
<html>
    <head>
        <title>Basic Style Example</title>
        <style>
            *{
                font-family: 'Times New Roman', Times, serif;
            }
            h1,h2 {
                color: blue;
            }
            p {
                color: green;
            }
            #main {
                color: green;
            }
            .focus {   
                color: red;
                font-weight: bold;

            }
            .suggestions {   
                color: blue;
                font-style: italic;
            }
            .tips {       
                color: purple; 
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>What is Your Aim?</h1>
        <p>My aim is to learn MERN stack.</p>
        <p id="main">savory Minds is only the way to achieve that.</p>
        <p class="focus">Focus on each one.</p>
        <p class="suggestions">Never give up.</p>
        <p class="tips">Be consistent.</p>
        <h2>Additional Tips</h2>
        <h2>Learn peacefully</h2>
        <p style="color: orange;">Practice regularly.</p>
    </body>
</html>
