<!DOCTYPE html>
<html>
<head>
    <title>Card</title>

    <style>
        .card {
            width: 250px;
            padding: 15px;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            background-color: rgb(196, 50, 50);
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>JavaScript</h2>
        <p>
            Hello this is my 4th exam of MERN Stack classes.
        </p>
    </div>

</body>
</html>
