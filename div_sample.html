<!DOCTYPE html>
<html lang="en">
<head>
    <title>Div Sample</title>
<style>
    *{
        font-family: arial, sans-serif;
    }
    .header {
        background-color: orange;
        height: 100px;
        width: 100%;
        text-align: center;
    }
    .content {
        background-color: green;
        height: 200px;
        width: 100%;   
        text-align: center;
    }
    .display {
        background-color: blue;
        height: 200px;
        width: 100%;
        text-align: center;
    }
    .footer {
        background-color: purple;
        height: 100px;
        width: 100%;
        text-align: center;
    }
</style>
</head>
<body>
   <div class="header">
        <h1>Welcome to My  FirstDiv Sample</h1>
    </div>
    <div class="content">
        <p>This is the content section.</p>
    </div>
    <div class="display">
        <p>This is the display section.</p>
    </div>
    <div class="footer">
        <p>This shows the footer section.</p>
    </div>
</body>
</html>
