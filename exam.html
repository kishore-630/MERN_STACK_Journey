<!DOCTYPE html>
<html>
<head>
    <title>Student Card</title>

    <style>
        .card {
            border: 2px solid black;
            background-color: aqua;
            padding: 20px;
            text-align: center;
            width: 250px;
            margin: 50px auto;
            border-radius: 15px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: 1px solid black;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Kishore Kumar</h2>
    <p>Course: Computer Science Engineering</p>
    <button>View Profile</button>
</div>

</body>
</html>
